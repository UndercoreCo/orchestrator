name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -r requirements-security.txt
      - run: python -m pytest -q
      - run: python scripts/check_secrets.py
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
      - run: python scripts/check_workflows.py
  release:
    needs: verify
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps .
      - run: undercore-orchestrator --help
      - run: ruff check orchestrator scripts tests
      - run: ruff format --check orchestrator scripts tests
      - run: python -m pytest -q
      - run: python scripts/check_contracts.py
      - run: python scripts/check_architecture.py
      - run: python -m mypy
      - name: Check version and package exact commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(cat VERSION)"
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
          python scripts/build_release.py --ref "${{ github.sha }}"
      - name: Attest exact release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.tar.gz
      - name: Publish reviewed version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPO: ${{ github.repository }}
        run: python scripts/publish_release.py --repo "$RELEASE_REPO" --tag "$TAG" --commit "$RELEASE_COMMIT"
