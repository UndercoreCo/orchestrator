name: Orchestrator checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps .
      - run: undercore-orchestrator --help
      - run: ruff check orchestrator scripts tests
      - run: ruff format --check orchestrator scripts tests
      - run: python -m pytest -q
      - run: python scripts/check_contracts.py
      - run: python scripts/check_architecture.py
      - run: python -m mypy
      - run: python scripts/check_workflows.py
      - run: python -m orchestrator --settings config/settings.example.json check-config --structure-only
      - run: python scripts/build_release.py --ref "${{ github.sha }}"
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-security.txt
      - run: python scripts/check_secrets.py
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
