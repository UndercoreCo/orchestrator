[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "undercore-orchestrator"
dynamic = ["version"]
description = "Independent VPN connection orchestration with durable node lifecycle"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "httpx==0.28.1", "pydantic==2.13.5", "uvicorn==0.52.4", "segno==1.6.6", "cryptography==50.0.1", "prometheus-client==0.26.0"]

[project.scripts]
undercore-orchestrator = "orchestrator.interfaces.cli.main:main"
orchestratorctl = "orchestrator.interfaces.cli.main:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.package-data]
"orchestrator.interfaces.http" = ["panel_assets/*.html", "panel_assets/*.css", "panel_assets/*.js"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F401", "F811", "E402"]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
files = ["orchestrator/domain", "orchestrator/application/ports.py", "orchestrator/application/repository_ports.py", "orchestrator/application/drivers.py", "orchestrator/infrastructure/sqlite", "orchestrator/infrastructure/drivers/amneziawg.py", "orchestrator/infrastructure/drivers/amnezia_leases.py", "orchestrator/infrastructure/drivers/trusttunnel_configuration.py", "orchestrator/infrastructure/drivers/trusttunnel_contract.py", "orchestrator/infrastructure/drivers/trusttunnel.py", "orchestrator/infrastructure/credentials.py", "scripts/check_types.py"]

[[tool.mypy.overrides]]
module = ["orchestrator.application.ports", "orchestrator.application.repository_ports", "orchestrator.application.drivers", "orchestrator.infrastructure.drivers.amneziawg", "orchestrator.infrastructure.drivers.amnezia_leases", "orchestrator.infrastructure.drivers.trusttunnel", "scripts.check_types"]
disallow_untyped_defs = true
